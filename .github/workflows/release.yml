name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # When .changeset/*.md files exist, this creates/updates a "Version Packages" PR.
      # When none exist (the Version Packages PR was just merged), this is a no-op.
      - name: Changesets version
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish if the local version is ahead of what's on npm.
      # Uses OIDC trusted publishers — no NPM_TOKEN needed.
      # Also creates a git tag and GitHub release.
      - name: Publish to npm and create GitHub release
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view inei version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "Publishing inei@$CURRENT (npm has $PUBLISHED)"
            pnpm build
            npm publish --provenance --access public
            git tag "v$CURRENT"
            git push origin "v$CURRENT"
            gh release create "v$CURRENT" --generate-notes --title "v$CURRENT"
          else
            echo "inei@$CURRENT already published, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
