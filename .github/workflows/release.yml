name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publish if the local version is ahead of what's on npm.
      # Uses OIDC trusted publishers — no NPM_TOKEN needed.
      - name: Publish to npm
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view inei version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "Publishing inei@$CURRENT (npm has $PUBLISHED)"
            pnpm build
            npm publish --provenance --access public
          else
            echo "inei@$CURRENT already published, skipping"
          fi
